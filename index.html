<!DOCTYPE html>
<html lang="ru">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<meta property="og:description" content="Настоящие записи СНГ: 762 трека, 29 исполнителей, 78 альбомов. Превью 30 секунд, обложки, плейлисты и статистика." />
<meta property="og:image" content="screenshot.png" />

<link rel="stylesheet" href="styles.css" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="favicon.svg" />
</head>
<body>
<a class="skip-link" href="#view">Перейти к содержимому</a>
<div class="app">
  <aside class="sidebar" aria-label="Основная навигация">
    <a class="brand" href="#/home" aria-label="Pulse — на главную">
      <span class="brand-mark" aria-hidden="true">P</span>
      <span class="brand-name">Pulse<small>музыка · демо</small></span>
    </a>
    <nav class="nav" aria-label="Разделы">
      <a class="nav-link" data-nav="home" href="#/home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Главная</a>
      <a class="nav-link" data-nav="library" href="#/library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 4v16M9 4v16M13 5v14M18 5v14M2 20h20"/></svg>Библиотека</a>
      <a class="nav-link" data-nav="liked" href="#/liked"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20.5C7 16.5 3 13.2 3 9.3 3 6.4 5.2 4.5 7.7 4.5c1.7 0 3.3.9 4.3 2.4 1-1.5 2.6-2.4 4.3-2.4 2.5 0 4.7 1.9 4.7 4.8 0 3.9-4 7.2-9 11.2z"/></svg>Мне нравится</a>
      <a class="nav-link" data-nav="stats" href="#/stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Статистика</a>
      <a class="nav-link" data-nav="history" href="#/history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>История</a>
    </nav>
    <div>
      <div class="side-title">ПЛЕЙЛИСТЫ</div>
      <div class="side-playlists" id="sidePlaylists"></div>
      <div style="padding:8px"><button class="btn btn-sm btn-block" data-action="create-pl" aria-label="Создать новый плейлист">+ Новый плейлист</button></div>
    </div>
    <a class="side-profile" id="sideProfile" href="#/profile" aria-label="Открыть профиль"></a>
    <div class="side-foot">превью: iTunes · полные версии: YouTube<br />Space — play · N/P — треки · Detroll1</div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <span class="top-brand" aria-hidden="true"><span class="brand-mark">P</span> <span class="top-brand-name">Pulse</span></span>
      <form id="searchForm" class="search-wrap" role="search" aria-label="Поиск музыки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input class="search-input" id="topSearch" type="search" placeholder="Вьюга, Сансара, Zivert…" aria-label="Поиск по каталогу" autocomplete="off" />
      </form>
      <button class="profile-btn" id="topProfile" data-action="go-profile" aria-label="Открыть профиль"></button>
    </header>
    <main class="content" id="view" tabindex="-1" aria-live="polite" aria-label="Содержимое страницы"></main>
  </div>
</div>

<nav class="mobile-nav" aria-label="Мобильная навигация">
  <a data-nav="home" href="#/home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Главная</a>
  <a data-nav="library" href="#/library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 4v16M9 4v16M13 5v14M18 5v14M2 20h20"/></svg>Библио</a>
  <a data-nav="stats" href="#/stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Статы</a>
  <a data-nav="profile" href="#/profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6.5 8-6.5s8 2.5 8 6.5"/></svg>Профиль</a>
</nav>

<footer class="player" aria-label="Плеер">
  <div class="player-inner">
    <div class="player-track">
      <img class="player-cover" id="pCover" alt="" />
      <div class="player-names"><b id="pTitle">Ничего не играет</b><button class="player-artist-btn" id="pArtist" data-action="player-artist" aria-label="Исполнители текущего трека">Выберите трек из подборки</button></div>
      <button class="icon-btn" id="pLike" aria-label="Добавить в «Мне нравится»" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20.5C7 16.5 3 13.2 3 9.3 3 6.4 5.2 4.5 7.7 4.5c1.7 0 3.3.9 4.3 2.4 1-1.5 2.6-2.4 4.3-2.4 2.5 0 4.7 1.9 4.7 4.8 0 3.9-4 7.2-9 11.2z"/></svg></button>
      <button class="icon-btn hide-mobile" id="pAdd" aria-label="Добавить текущий трек в плейлист"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <span class="player-badge hide-mobile" id="pBadge" title="В Pulse играют 30-секундные превью">превью</span>
    </div>
    <div class="player-center">
      <div class="player-controls" role="group" aria-label="Управление воспроизведением">
        <button class="icon-btn" id="btnShuffle" aria-label="Случайный порядок" aria-pressed="false" title="Случайный порядок"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h4l10 12h4m0 0l-3-3m3 3l-3 3M3 18h4l2.5-3M13.5 9L17 6h4m0 0l-3-3m3 3l-3 3"/></svg></button>
        <button class="icon-btn" id="btnPrev" aria-label="Предыдущий трек"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 6l-8.5 6L18 18zM6 6h2v12H6z"/></svg></button>
        <button class="icon-btn play" id="btnPlay" aria-label="Слушать"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg></button>
        <button class="icon-btn" id="btnNext" aria-label="Следующий трек"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6l8.5 6L6 18zM16 6h2v12h-2z"/></svg></button>
        <button class="icon-btn" id="btnRepeat" aria-label="Повтор выключен" aria-pressed="false" title="Повтор"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3"/></svg></button>
      </div>
      <div class="progress-wrap">
        <span class="time" id="tCur">0:00</span>
        <input class="progress" id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Перемотка трека" />
        <span class="time" id="tDur">0:00</span>
      </div>
    </div>
    <div class="player-right">
      <span class="vol-wrap">
        <button class="icon-btn" id="btnMute" aria-label="Выключить звук"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/></svg></button>
        <input class="volume" id="vol" type="range" min="0" max="100" value="80" aria-label="Громкость" />
      </span>
      <button class="icon-btn" id="btnQueue" aria-label="Открыть очередь воспроизведения" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 10h16M4 14h10M18 14v6m0 0l-2.5-2.5M18 20l2.5-2.5"/></svg><span class="queue-count" id="queueCount"></span></button>
    </div>
  </div>
</footer>

<aside class="drawer" id="queueDrawer" role="dialog" aria-modal="false" aria-label="Очередь воспроизведения">
  <div class="drawer-head">
    <h2>Очередь</h2>
    <span class="kv">что играет дальше</span>
    <span style="flex:1"></span>
    <button class="icon-btn" id="queueClose" aria-label="Закрыть очередь"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="drawer-body" id="queueBody"></div>
</aside>
<div class="scrim" id="scrim"></div>
<div class="modal-root" id="modalRoot"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="watermark" aria-hidden="true">Detroll © 2026</div>

<script src="data.js"></script>
<script src="art.js"></script>
<script src="player.js"></script>
<script src="yt.js"></script>
<script src="app.js"></script>
<div id="ytHolder" aria-hidden="true"><div id="ytPlayer"></div></div>
</body>
</html>
